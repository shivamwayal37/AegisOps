server:
  port: 8080

spring:
  application:
    name: aegisops-agent
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:aegisops
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # H2 Console (Optional - Web UI)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # Recreates schema on restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  prometheus:
    metrics:
      export:
        enabled: true

aegisops:
  kubernetes:
    namespace: default
    in-cluster: false
  
  openai:
    api-key: ${OPENAI_API_KEY:sk-dummy-key}
    model: gpt-4o
    max-tokens: 1000
    temperature: 0.3
  
  safety:
    require-approval: true
    confidence-threshold: 0.7
    max-replicas: 10
    cooldown-seconds: 300
    allowed-namespaces: default,staging
    dry-run: true  # Enable dry-run for local testing
  
  remediation:
    enabled-actions: RESTART_POD,SCALE_DEPLOYMENT,ROLLOUT_RESTART
    max-concurrent: 5

logging:
  level:
    root: INFO
    io.aegisops: DEBUG
    io.fabric8.kubernetes: WARN
    org.hibernate.SQL: DEBUG