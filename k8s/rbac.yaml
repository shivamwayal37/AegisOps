apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisops-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisops-agent-role
rules:
# Read pods and pod logs
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]

# Read pod events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

# Delete pods (for restart)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]

# Read and update deployments (for scaling)
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]

# Rollout restarts
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]

# Read replica sets
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisops-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisops-agent-role
subjects:
- kind: ServiceAccount
  name: aegisops-agent
  namespace: default