apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisops-config
  namespace: default
data:
  # Application configuration
  application.yaml: |
    server:
      port: 8080

    spring:
      application:
        name: aegisops-agent
      
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: false
        properties:
          hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect

    management:
      endpoints:
        web:
          exposure:
            include: health,prometheus,info,metrics
      metrics:
        export:
          prometheus:
            enabled: true
      endpoint:
        health:
          show-details: always

    aegisops:
      kubernetes:
        namespace: default
        in-cluster: true
      
      openai:
        model: gpt-4o
        max-tokens: 1000
        temperature: 0.3
      
      safety:
        require-approval: true
        confidence-threshold: 0.7
        max-replicas: 10
        cooldown-seconds: 300
        allowed-namespaces: default,staging
        dry-run: false
      
      remediation:
        enabled-actions: RESTART_POD,SCALE_DEPLOYMENT,ROLLOUT_RESTART
        max-concurrent: 5

    logging:
      level:
        root: INFO
        io.aegisops: DEBUG
        io.fabric8.kubernetes: WARN