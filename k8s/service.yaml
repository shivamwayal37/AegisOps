# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegisops-agent-monitor
  namespace: default
  labels:
    app: aegisops-agent
    release: prometheus
spec:
  selector:
    matchLabels:
      app: aegisops-agent
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - default